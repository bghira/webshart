[package]
name = "webshart"
version = "0.5.1"
edition = "2021"
authors = ["bghira <bghira@users.github.com>"]
license = "MIT"
description = "Fast and memory-efficient webdataset shard reader with Python bindings"
repository = "https://github.com/yourubghirasername/webshart"
readme = "README.md"

[lib]
name = "webshart"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "signal"] }
regex = "1.13.1"
futures = "0.3.33"
sha2 = "0.11.0"
tar = "0.4.46"
indicatif = "0.18.6"
imagesize = "0.15.0"
pythonize = "0.29.0"
rand = "0.10.2"
fs2 = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
mockito = "1.7.2"

[profile.release]
#lto = true
#codegen-units = 1
opt-level = 3
